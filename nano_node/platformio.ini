; PlatformIO Configuration File for Arduino Nano (Sensor Node)
[env:nano]
platform = atmelavr
board = nanoatmega328new
framework = arduino
monitor_speed = 115200

lib_deps =
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0

build_flags =
    -D MONITOR_SPEED=115200

; If your clone uses the newer bootloader and avrdude fails, 
; uncomment the following line:
; board = nanoatmega328newnew
